<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">vibecosystem runtime profiles</title><desc id="desc">Core is the default runtime. Catalog (in repo) has 138 agents, 296 skills, 74 hooks and 20 rules. Default core has 12 agents, 32 skills and 6 hooks. The full profile installs 138 agents, 296 skills, 20 rules and 53 of the 74 hooks. Catalog size is different from active context.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#121322"/><stop offset="1" stop-color="#221a38"/></linearGradient><linearGradient id="accent"><stop stop-color="#b5a0ff"/><stop offset="1" stop-color="#ddd2ff"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<g fill="#f4f0ff" font-family="Arial, Helvetica, sans-serif">
<text x="62" y="58" font-size="32" font-weight="700" fill="#cab7ff">vibecosystem</text>
<text x="62" y="108" font-size="44" font-weight="700" fill="#ffffff">Keep the default path focused.</text>
<text x="62" y="146" font-size="23" font-weight="400" fill="#d5cfe5">Select capabilities for the task. Inspect what is active.</text>
<rect x="62" y="168" width="500" height="96" rx="18" fill="#30244c" stroke="#bba4ff" stroke-width="2"/><text x="86" y="209" font-size="24" font-weight="700" fill="#ddd0ff">core · default</text><text x="86" y="240" font-size="16" font-weight="400" fill="#d5cfe5">Investigate → implement → review → verify</text>
<rect x="600" y="168" width="250" height="88" rx="18" fill="#1c1d30" stroke="#484159" stroke-width="1"/><text x="624" y="209" font-size="24" font-weight="700" fill="#f4f0ff">quality</text><text x="624" y="240" font-size="16" font-weight="400" fill="#d5cfe5">Focused edit checks</text>
<rect x="874" y="168" width="264" height="88" rx="18" fill="#1c1d30" stroke="#484159" stroke-width="1"/><text x="898" y="209" font-size="24" font-weight="700" fill="#f4f0ff">context</text><text x="898" y="240" font-size="16" font-weight="400" fill="#d5cfe5">Targeted retrieval</text>
<rect x="600" y="268" width="250" height="88" rx="18" fill="#1c1d30" stroke="#484159" stroke-width="1"/><text x="624" y="309" font-size="24" font-weight="700" fill="#f4f0ff">memory</text><text x="624" y="340" font-size="16" font-weight="400" fill="#d5cfe5">Persistent recall</text>
<rect x="874" y="268" width="264" height="88" rx="18" fill="#1c1d30" stroke="#484159" stroke-width="1"/><text x="898" y="309" font-size="24" font-weight="700" fill="#f4f0ff">orchestration</text><text x="898" y="340" font-size="16" font-weight="400" fill="#d5cfe5">Explicit agent workflows</text>
<text x="86" y="294" font-size="23" font-weight="700" fill="#d9ccff">Bounded optional hook context</text>
<text x="86" y="326" font-size="21" font-weight="400" fill="#d5cfe5">4,000 characters / event</text>
<text x="86" y="356" font-size="21" font-weight="400" fill="#d5cfe5">12,000 characters / session</text>
<text x="600" y="388" font-size="19" font-weight="400" fill="#d5cfe5">dashboard · optional local activity monitor</text>
<path d="M562 216 H580 V312 H600 M580 212 H600" fill="none" stroke="#8f78c9" stroke-width="2"/>
<path d="M62 404 H1138" stroke="#484159"/>
<rect x="62" y="418" width="526" height="100" rx="18" fill="#1c1d30" stroke="#484159" stroke-width="1"/><text x="86" y="459" font-size="24" font-weight="700" fill="#f4f0ff">Catalog (in repo)</text><text x="86" y="490" font-size="16" font-weight="400" fill="#d5cfe5">138 agents · 296 skills · 74 hooks · 20 rules</text>
<rect x="612" y="418" width="526" height="100" rx="18" fill="#1c1d30" stroke="#484159" stroke-width="1"/><text x="636" y="459" font-size="24" font-weight="700" fill="#f4f0ff">Default core</text><text x="636" y="490" font-size="16" font-weight="400" fill="#d5cfe5">12 agents · 32 skills · 6 hooks</text>
<text x="62" y="546" font-size="22" font-weight="700" fill="#ddd0ff">full (opt-in): 138 agents, 296 skills, 20 rules, 53 of 74 hooks</text>
<text x="62" y="576" font-size="22" font-weight="400" fill="#d5cfe5">Catalog size ≠ active context ≠ model token bill</text>
<text x="62" y="608" font-size="17" font-weight="400" fill="#9d96b1">Conceptual diagram · not a recording of automated execution</text>
</g>
</svg>
